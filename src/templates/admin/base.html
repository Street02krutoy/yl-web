<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-gray-900 text-white">
        <div class="max-w-7xl mx-auto px-4 flex items-center justify-between h-14">
            <div class="flex items-center gap-6">
                <a href="{{ url_for('admin_dashboard') }}" class="font-bold text-lg">Admin Panel</a>
                <a href="{{ url_for('admin_points') }}" class="text-gray-300 hover:text-white transition-colors">Точки</a>
                <a href="{{ url_for('admin_questions') }}" class="text-gray-300 hover:text-white transition-colors">Вопросы</a>
            </div>
            <div class="flex items-center gap-4">
                <a href="{{ url_for('index') }}" class="text-gray-400 hover:text-white text-sm">На сайт</a>
                <a href="{{ url_for('admin_logout') }}" class="text-gray-400 hover:text-white text-sm">Выйти</a>
            </div>
        </div>
    </nav>
    <div class="max-w-7xl mx-auto p-6">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-4 mb-4 rounded-lg {% if category == 'error' %}bg-red-100 text-red-700 border border-red-200{% else %}bg-green-100 text-green-700 border border-green-200{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
