{% extends "admin/base.html" %}
{% block title %}{% if point %}Редактировать{% else %}Добавить{% endif %} точку{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if point %}Редактировать{% else %}Добавить{% endif %} точку</h1>
<div class="bg-white p-6 rounded-xl shadow-md max-w-lg">
    <form method="POST">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Название</label>
            <input type="text" name="name" required value="{{ point.name if point else '' }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Широта</label>
            <input type="text" name="latitude" required value="{{ point.latitude if point else '' }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="56.13646">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Долгота</label>
            <input type="text" name="longitude" required value="{{ point.longitude if point else '' }}"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="47.23653">
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
            <textarea name="description" rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">{{ point.description if point else '' }}</textarea>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Сохранить
            </button>
            <a href="{{ url_for('admin_points') }}"
                class="text-gray-600 hover:text-gray-800">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
