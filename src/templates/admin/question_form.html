{% extends "admin/base.html" %}
{% block title %}{% if question %}Редактировать{% else %}Добавить{% endif %} вопрос{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-6">{% if question %}Редактировать{% else %}Добавить{% endif %} вопрос</h1>
<div class="bg-white p-6 rounded-xl shadow-md max-w-2xl">
    <form method="POST">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Вопрос</label>
            <textarea name="text" rows="2" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">{{ question.text if question else '' }}</textarea>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Вариант 1</label>
                <input type="text" name="option1" required value="{{ question.option1 if question else '' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Вариант 2</label>
                <input type="text" name="option2" required value="{{ question.option2 if question else '' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Вариант 3</label>
                <input type="text" name="option3" required value="{{ question.option3 if question else '' }}"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-1">Правильный ответ</label>
            <select name="correct_index"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="0" {% if question and question.correct_index == 0 %}selected{% endif %}>Вариант 1</option>
                <option value="1" {% if question and question.correct_index == 1 %}selected{% endif %}>Вариант 2</option>
                <option value="2" {% if question and question.correct_index == 2 %}selected{% endif %}>Вариант 3</option>
            </select>
        </div>
        <div class="flex items-center gap-3">
            <button type="submit"
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Сохранить
            </button>
            <a href="{{ url_for('admin_questions') }}"
                class="text-gray-600 hover:text-gray-800">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
